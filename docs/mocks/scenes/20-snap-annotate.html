<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"/><link rel="stylesheet" href="../snap.css"/></head>
<body><div class="snap-stage"><div class="snap-editor">
  <div class="snap-toolbar">
    <div class="snap-tool">▸</div><div class="snap-tool">○</div><div class="snap-tool">□</div><div class="snap-tool">T</div>
    <div class="snap-tool is-on">▒</div><div class="snap-tool">✦</div>
    <div class="snap-meta"><span>100%</span><span>1920×1080</span><span style="color:#fff;font-weight:600">Сохранить</span></div>
  </div>
  <div class="snap-canvas"><div class="snap-shot" style="position:relative">
    <div class="bar" style="width:40%;background:#C026D3;margin-top:28px"></div>
    <div class="bar" style="width:70%"></div><div class="bar" style="width:55%"></div><div class="bar" style="width:80%"></div>
    <div class="pixel-box" style="right:40px;top:80px;width:180px;height:90px"></div>
    <div class="arrow-ann" style="left:220px;top:160px;transform:rotate(-25deg)"></div>
  </div></div>
</div></div></body></html>
