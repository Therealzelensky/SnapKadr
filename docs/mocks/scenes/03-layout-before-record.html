<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>03 layout before record — SnapKadr mock</title>
  <link rel="stylesheet" href="../capture.css" />
</head>
<body>
  <!-- Focus: armed StudioCaptureToolbar — chips + Старт (height 64, pad 14, mini 84×40) -->
  <div class="capture-stage">
    <div class="desk-wins">
      <div class="ghost" style="left:180px;top:160px;width:420px;height:320px">
        <div class="t"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="b"><span style="width:40%;background:#C026D3"></span><span style="width:70%"></span><span style="width:55%"></span><span style="width:80%"></span></div>
      </div>
      <div class="ghost" style="left:920px;top:200px;width:380px;height:280px">
        <div class="t"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="b"><span style="width:35%;background:#38BDF8"></span><span style="width:60%"></span><span style="width:75%"></span></div>
      </div>
    </div>
    <div class="capture-stack">
      <div class="capsule upper">
        <div class="mini-layout"><i></i><i></i><i></i></div>
        <div class="divider"></div>
        <span style="opacity:.75;font-size:13px">Рамки ▾</span>
        <div class="chip">Окно А <span class="x">×</span></div>
        <div class="chip">Окно В <span class="x">×</span></div>
        <div class="icon-btn">+</div>
        <span style="opacity:.45;margin-left:4px">🗑</span>
      </div>
      <div class="capsule lower">
        <div class="close-x">✕</div>
        <span class="beta">BETA</span>
        <div class="divider"></div>
        <div class="start"><span class="dot"></span>Старт</div>
        <div class="divider"></div>
        <div class="input-row">
          <div class="ctl">📷 ✕ ▾</div>
          <div class="ctl">🎙 ✕ ▾</div>
          <div class="ctl">🖥 ♪ ▾</div>
        </div>
        <div class="divider"></div>
        <div class="ctl" style="padding:0 14px;opacity:.8">⚙ ▾</div>
      </div>
    </div>
  </div>
</body>
</html>
