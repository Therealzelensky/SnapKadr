<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"/><link rel="stylesheet" href="../editor.css"/></head>
<body><div class="stage"><div class="editor">
  <div class="editor-top">
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="editor-title">Кадр Demo</div>
    <div class="editor-top-actions"><button class="btn-export" type="button">Экспорт</button></div>
  </div>
  <div class="editor-body">
    <div class="tool-strip"><div class="tool is-on">↖</div><div class="tool">Aa</div><div class="tool">○</div><div class="tool">↗</div></div>
    <div class="main-col">
      <div class="preview-wrap">
        <div class="preview-mode"><span class="">Авто</span><span class="is-on">Кадр</span><span class="">Маска</span></div>
        <div class="preview-canvas"><div class="comp carded"><div class="anon-win" style="min-height:320px"><div class="anon-title"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="anon-body"><div class="hero"></div><div class="bar a"></div><div class="bar d"></div><div class="bar c"></div><div class="bar b"></div><div class="bar d"></div></div></div></div></div>
      </div>
      <div class="transport"><div class="play">▶</div><span>00:18.40 / 00:41</span></div>
      <div class="timeline"><div class="track"><label>Окно А</label><div class="lane"><div class="clip orange" style="left:6%;width:70%"></div></div></div><div class="track"><label>Окно В</label><div class="lane"><div class="clip cyan" style="left:16%;width:48%"></div></div></div><div class="track"><label>Телефон</label><div class="lane"><div class="clip pink" style="left:28%;width:44%"></div></div></div><div class="track"><label>Аудио</label><div class="lane"><div class="clip green" style="left:4%;width:88%"></div></div></div></div>
    </div>
    
<aside class="sidebar"><h3>Стиль</h3>
<div class="side-label">Холст</div>
<div class="seg"><button type="button">Авто</button><button type="button">1:1</button><button class="is-on" type="button">16:9</button><button type="button">9:16</button></div>
<div class="side-label">Фон</div>
<div class="swatches"><i class="is-on" style="background:linear-gradient(135deg,#7C3AED,#C026D3)"></i><i style="background:#1d4ed8"></i><i style="background:#ea580c"></i><i style="background:#16a34a"></i><i style="background:#C026D3"></i><i style="background:#27272a"></i></div>
<div class="slider"><div class="row"><span>Отступ</span><span>18%</span></div><div class="rail"><b style="width:18%"></b></div></div>
<div class="slider"><div class="row"><span>Скругление</span><span>22</span></div><div class="rail"><b style="width:22%"></b></div></div>
<button class="side-btn" type="button">Применить стиль</button></aside>
  </div>
</div></div></body></html>
