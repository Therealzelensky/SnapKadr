<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>02 multi-window — SnapKadr mock</title>
  <link rel="stylesheet" href="../editor.css" />
</head>
<body>
  <!-- Focus: several anonymized windows in one editor frame (EditorView.Grid) -->
  <div class="stage">
    <div class="editor">
      <div class="editor-top">
        <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="editor-title">Кадр Demo</div>
        <div class="editor-top-actions">
          <span class="rec-dot"></span>
          <button class="btn-export" type="button">Экспорт</button>
        </div>
      </div>
      <div class="editor-body">
        <div class="tool-strip">
          <div class="tool is-on">↖</div>
          <div class="tool">Aa</div>
          <div class="tool">○</div>
          <div class="tool">↗</div>
        </div>
        <div class="main-col">
          <div class="preview-wrap">
            <div class="preview-mode">
              <span>Авто</span><span class="is-on">Кадр</span><span>Маска</span>
            </div>
            <div class="preview-canvas">
              <div class="comp multi">
                <div class="anon-win w-a">
                  <div class="anon-title"><i class="r"></i><i class="y"></i><i class="g"></i></div>
                  <div class="anon-body">
                    <div class="hero"></div>
                    <div class="bar a"></div>
                    <div class="bar d"></div>
                    <div class="bar c"></div>
                    <div class="bar b"></div>
                    <div class="bar d"></div>
                    <div class="bar e"></div>
                    <div class="bar c"></div>
                  </div>
                </div>
                <div class="anon-win">
                  <div class="anon-title"><i class="r"></i><i class="y"></i><i class="g"></i></div>
                  <div class="anon-body">
                    <div class="avatars">
                      <i style="background:#C026D3"></i>
                      <i style="background:#38BDF8"></i>
                      <i style="background:#7C3AED"></i>
                      <i style="background:#F97316"></i>
                    </div>
                    <div class="bar d"></div>
                    <div class="bar c"></div>
                    <div class="bar d"></div>
                  </div>
                </div>
                <div class="anon-win phone">
                  <div class="anon-title"><i class="r"></i><i class="y"></i><i class="g"></i></div>
                  <div class="anon-body grid3">
                    <i style="background:#C026D3"></i><i style="background:#38BDF8"></i><i style="background:#F97316"></i>
                    <i style="background:#22C55E"></i><i style="background:#7C3AED"></i><i style="background:#EC4899"></i>
                    <i style="background:#38BDF8"></i><i style="background:#F97316"></i><i style="background:#C026D3"></i>
                    <i style="background:#7C3AED"></i><i style="background:#22C55E"></i><i style="background:#4a4e5a"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="transport"><div class="play">▶</div><span>00:18.40 / 00:41</span></div>
          <div class="timeline">
            <div class="track"><label>Окно А</label><div class="lane"><div class="clip orange" style="left:6%;width:72%"></div></div></div>
            <div class="track"><label>Окно В</label><div class="lane"><div class="clip cyan" style="left:16%;width:48%"></div></div></div>
            <div class="track"><label>Телефон</label><div class="lane"><div class="clip pink" style="left:28%;width:44%"></div></div></div>
            <div class="track"><label>Зум</label><div class="lane"><div class="clip violet" style="left:36%;width:18%"></div></div></div>
            <div class="track"><label>Аудио</label><div class="lane"><div class="clip green" style="left:4%;width:88%"></div></div></div>
          </div>
        </div>
        <aside class="sidebar">
          <h3>Стиль</h3>
          <div class="side-label">Холст</div>
          <div class="seg">
            <button class="is-on" type="button">Авто</button>
            <button type="button">1:1</button>
            <button type="button">16:9</button>
            <button type="button">9:16</button>
          </div>
          <div class="side-label">Фон</div>
          <div class="seg">
            <button class="is-on" type="button">Обои</button>
            <button type="button">Градиент</button>
            <button type="button">Цвет</button>
            <button type="button">Фото</button>
          </div>
          <div class="swatches" style="margin-top:10px">
            <i class="is-on" style="background:linear-gradient(135deg,#7C3AED,#38BDF8)"></i>
            <i style="background:#1d4ed8"></i>
            <i style="background:#ea580c"></i>
            <i style="background:#16a34a"></i>
            <i style="background:#C026D3"></i>
            <i style="background:#27272a"></i>
          </div>
          <div class="slider"><div class="row"><span>Размытие фона</span><span>82%</span></div><div class="rail"><b style="width:82%"></b></div></div>
          <div class="slider"><div class="row"><span>Отступ</span><span>5%</span></div><div class="rail"><b style="width:5%"></b></div></div>
          <div class="slider"><div class="row"><span>Скругление</span><span>13</span></div><div class="rail"><b style="width:13%"></b></div></div>
          <button class="side-btn" type="button">Применить стиль</button>
        </aside>
      </div>
    </div>
  </div>
</body>
</html>
